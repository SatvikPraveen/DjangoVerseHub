{% extends 'base.html' %}
{% block title %}Unsubscribe - {{ SITE_NAME }}{% endblock %}
{% block content %}
<div class="container py-5 text-center">
  <h1 class="h3">Unsubscribe {{ subscriber.email }}?</h1>
  <p class="text-muted">You will stop receiving the {{ SITE_NAME }} newsletter. You can subscribe again at any time.</p>
  <form method="post">{% csrf_token %}<button class="btn btn-danger" type="submit">Unsubscribe</button> <a class="btn btn-outline-secondary" href="{% url 'core:home' %}">Keep my subscription</a></form>
</div>
{% endblock %}
