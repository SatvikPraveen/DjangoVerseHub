# File: DjangoVerseHub/.github/workflows/ci.yml
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check .
      - run: ruff format --check .

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements/*.txt
      - name: Install dependencies
        run: pip install -r requirements/test.txt
      - name: Django system checks
        env:
          DJANGO_SETTINGS_MODULE: django_verse_hub.settings.test
        run: python manage.py check
      - name: Migrations are up to date
        env:
          DJANGO_SETTINGS_MODULE: django_verse_hub.settings.test
          KEEP_MIGRATIONS: "1"
        run: python manage.py makemigrations --check --dry-run
      - name: Migration graph applies cleanly (SQLite)
        env:
          DJANGO_SETTINGS_MODULE: django_verse_hub.settings.test
          KEEP_MIGRATIONS: "1"
        run: python -m pytest -q -x --no-header -p no:cacheprovider apps/articles/tests/test_comment_relation.py
      - name: Run tests
        run: python -m pytest -q --cov --cov-report=xml --cov-report=term
      - name: Upload coverage
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml

  postgres:
    name: Test against PostgreSQL
    runs-on: ubuntu-latest
    needs: lint
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: djangoversehub
          POSTGRES_USER: django_user
          POSTGRES_PASSWORD: django_password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U django_user -d djangoversehub"
          --health-interval 10s --health-timeout 5s --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/*.txt
      - run: pip install -r requirements/test.txt
      - name: Migrate and test on PostgreSQL
        env:
          DJANGO_SETTINGS_MODULE: django_verse_hub.settings.ci
          DB_HOST: localhost
          REDIS_URL: redis://localhost:6379/0
        run: |
          python manage.py migrate --noinput
          python -m pytest -q -x

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          target: production
          cache-from: type=gha
          cache-to: type=gha,mode=max
