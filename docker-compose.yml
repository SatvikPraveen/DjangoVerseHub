# File: DjangoVerseHub/docker-compose.yml
# Development stack: hot-reloading Django, ASGI server for WebSockets,
# Celery worker + beat, PostgreSQL, Redis. `docker compose up --build`.

x-app: &app
  build:
    context: .
    target: development
  volumes:
    - .:/app
    - media_volume:/app/media
  env_file: .env
  environment:
    DJANGO_SETTINGS_MODULE: django_verse_hub.settings.dev
    DB_HOST: db
    REDIS_URL: redis://redis:6379/0
    CELERY_BROKER_URL: redis://redis:6379/2
    CELERY_RESULT_BACKEND: redis://redis:6379/3
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_healthy
  restart: unless-stopped

services:
  db:
    image: postgres:15-alpine
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    environment:
      POSTGRES_DB: ${DB_NAME:-djangoversehub}
      POSTGRES_USER: ${DB_USER:-django_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-django_password}
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-django_user} -d ${DB_NAME:-djangoversehub}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    <<: *app
    command: sh -c "python manage.py migrate --noinput && python manage.py runserver 0.0.0.0:8000"
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health/live/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  asgi:
    <<: *app
    command: daphne -b 0.0.0.0 -p 8001 django_verse_hub.asgi:application
    ports:
      - "8001:8001"

  worker:
    <<: *app
    command: celery -A django_verse_hub worker -l info -Q celery,notifications,articles,users

  beat:
    <<: *app
    command: celery -A django_verse_hub beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./staticfiles:/app/staticfiles:ro
      - media_volume:/app/media:ro
    depends_on:
      - web
      - asgi
    restart: unless-stopped
    profiles: ["proxy"]

volumes:
  postgres_data:
  redis_data:
  media_volume:
